<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>VI.mate — peer-to-peer video calls</title>
    <meta
      name="description"
      content="Peer-to-peer video conferencing. Audio, video, and screen share travel directly between browsers over WebRTC — no media server in the middle."
    />

    <!--
      Favicon as an inline SVG data URI: the aperture mark from the wordmark,
      generated rather than hotlinked, and it costs no request. currentColor is
      not available here, so the accent is inlined.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308080B'/%3E%3Cg transform='translate(16 16)' fill='%23FF8A5B'%3E%3Cpath d='M0 -10 A10 10 0 0 1 8.7 -5 L0 0 Z'/%3E%3Cpath d='M0 -10 A10 10 0 0 1 8.7 -5 L0 0 Z' opacity='.62' transform='rotate(120)'/%3E%3Cpath d='M0 -10 A10 10 0 0 1 8.7 -5 L0 0 Z' opacity='.36' transform='rotate(240)'/%3E%3C/g%3E%3C/svg%3E"
    />

    <!--
      Painted before the bundle parses, so a dark-theme reload never flashes
      white. `initTheme()` in main.jsx takes over and reconciles the stored
      preference; this only has to get the background right for one frame.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vimate.theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.background =
            theme === 'light' ? '#F6F5F2' : '#08080B';
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08080B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      VI.mate is a real-time video application and needs JavaScript enabled.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
